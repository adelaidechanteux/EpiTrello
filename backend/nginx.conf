worker_processes auto;

events {}

http {
    include mime.types;
    sendfile on;

    upstream backend {
        server backend:5081;
    }

    server {

        listen 80;

        location /static/ {
            alias /app/staticfiles/;
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

    }
}
