[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "daphne>=4.2.1",
    "django>=5.2.7",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.5.1",
    "google-auth>=2.42.1",
    "psycopg[binary]>=3.3.2",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2.8",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "trellobackend.settings"
