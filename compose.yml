services:
  web:
    build: frontend/
    ports:
      - 3000:3000
  backend:
    build: "backend/"
    ports:
      - "5081:5081"
    environment:
      DB_PASS: "example"
      DB_USER: "postgres"
      DB_HOST: "database"
      DB_PORT: "5432"
      ALLOWED_HOSTS: "127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://127.0.0.1:5080; http://localhost:3000"
      CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:5080; http://localhost:3000"
      ENVIRON: "production"
    depends_on:
      - "database"
  # backend: # BACKEND TEST
  #   build: "backend/"
  #   ports:
  #     - "5081:5081"
  #   environment:
  #     DB_PASS: "example"
  #     DB_USER: "postgres"
  #     DB_HOST: "database"
  #     DB_PORT: "5432"
  #     ALLOWED_HOSTS: "127.0.0.1"
  #     CORS_ALLOWED_ORIGINS: "http://127.0.0.1:5080; http://localhost:3000"
  #     CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:5080; http://localhost:3000"
  #     ENVIRON: "test"
  #   depends_on:
  #     - "database"
  #   command: "sh -c './manage.py migrate | ./manage.py test'"
  #   restart: "no"
  backend_proxy:
    build:
      context: "backend/"
      dockerfile: "Dockerfile.nginx"
    ports:
      - "5080:80"
    depends_on:
      - "backend"
  database:
    image: "docker.io/postgres:18-trixie"
    ports:
      - "5432:5432"
    shm_size: "128mb"
    environment:
      POSTGRES_PASSWORD: "example"
      POSTGRES_USERNAME: "postgres"
    volumes:
      - "dbdata:/var/lib/postgresql"

volumes:
  dbdata:
