  #     ALLOWED_HOSTS: "127.0.0.1"
  #     CORS_ALLOWED_ORIGINS: "http://127.0.0.1:5080; http://localhost:3000"
  #     CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:5080; http://localhost:3000"
  #     ENVIRON: "test"
  #     DJANGO_SECRET_KEY: "django-insecure-2d6*a*m2@9y2%$+17#0j&#n+!lkh(a@*&j549u8ka6)uktemd0"
  #     EMAIL_SENDER: ""
  #   depends_on:
  #     - "database"
  #     - "valkey"
  #   command: "bash /home/nonroot/entrypoint_test.sh"
  #   restart: "no"
  backend_proxy:
    build:
      context: "backend/"
      dockerfile: "Dockerfile.nginx"
    ports:
      - "5080:80"
    depends_on:
      - "backend"
  database:
    image: "docker.io/postgres:18-trixie"
    ports:
      - "5432:5432"
    shm_size: "128mb"
    environment:
      POSTGRES_PASSWORD: "example"
      POSTGRES_USERNAME: "postgres"
    volumes:
      - "dbdata:/var/lib/postgresql"
  valkey:
    image: "valkey/valkey:9.0.1-trixie"
    ports:
      - "6379:6379"
    volumes:
      - "valkeydata:/data"
    command: "valkey-server --save 60 1 --loglevel warning"

volumes:
  dbdata:
  valkeydata:
