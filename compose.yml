services:
  web:
    build: frontend/
    ports:
      - 3000:3000
  backend:
    build: "backend/"
    ports:
      - "5081:5081"
    environment:
      DB_PASS: "example"
      DB_USER: "postgres"
      DB_HOST: "database"
      DB_PORT: "5432"
      VALKEY_HOST: "valkey"
      VALKEY_PORT: "6379"
      ALLOWED_HOSTS: "127.0.0.1; localhost"
      CORS_ALLOWED_ORIGINS: "http://127.0.0.1:5080; http://localhost:3000"
      CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:5080; http://localhost:3000"
      ENVIRON: "production"
      DJANGO_SECRET_KEY: "django-insecure-2d6*a*m2@9y2%$+17#0j&#n+!lkh(a@*&j549u8ka6)uktemd0"
      EMAIL_HOST: ""
      EMAIL_PORT: ""
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      EMAIL_SENDER: ""
    depends_on:
      - "database"
      - "valkey"
  # backend: # BACKEND TEST
  #   build: "backend/"
  #   ports:
  #     - "5081:5081"
  #   environment:
  #     DB_PASS: "example"
  #     DB_USER: "postgres"
  #     DB_HOST: "database"
  #     DB_PORT: "5432"
  #     VALKEY_HOST: "valkey"
