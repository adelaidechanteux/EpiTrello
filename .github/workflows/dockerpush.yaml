name: Docker Push


on:
  push:
  tags:


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ""
  REGISTRY_IMAGE: ""


jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: downcase REPO
        run: |
          export REPO=${GITHUB_REPOSITORY,,}
          echo "REPO=${REPO}" >>${GITHUB_ENV}
          echo "REGISTRY_IMAGE=${REGISTRY}/${REPO}" >>${GITHUB_ENV}
          echo "IMAGE_NAME=${REPO}" >>${GITHUB_ENV}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
#
# Backend
#
      - name: Backend Extract metadata (tags, labels) for Docker
        id: metabackend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}backend

      - name: Backend Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metabackend.outputs.tags }}
          labels: ${{ steps.metabackend.outputs.labels }}
          push: true
#
# Backend Static
#
      - name: Backend Static Extract metadata (tags, labels) for Docker
        id: metabackendstatic
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}backendstatic

      - name: Backend Static Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.nginx
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metabackendstatic.outputs.tags }}
          labels: ${{ steps.metabackendstatic.outputs.labels }}
          push: true
#
# Frontend
#
      - name: Frontend Extract metadata (tags, labels) for Docker
        id: metafrontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}frontend

      - name: Frontend Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metafrontend.outputs.tags }}
          labels: ${{ steps.metafrontend.outputs.labels }}
          push: true
